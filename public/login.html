<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>沫离drpy-node — 登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #eae5dc 0%, #f0ede8 40%, #e8e3d8 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.login-box {
  background: #faf8f5;
  border: 2px dashed #999;
  border-radius: 20px;
  padding: 40px 32px 32px;
  width: 100%; max-width: 380px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  animation: slideUp 0.5s ease-out;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.login-box h2 {
  text-align: center; color: #555; font-size: 22px;
  margin-bottom: 8px; letter-spacing: 2px;
}
.login-box .subtitle {
  text-align: center; color: #999; font-size: 13px; margin-bottom: 32px;
}
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 14px; color: #666; margin-bottom: 6px; font-weight: 500;
}
.form-group input {
  width: 100%; padding: 12px 14px;
  border: 2px solid #d4cfc6; border-radius: 10px;
  background: #fff; font-size: 15px; color: #333;
  outline: none; transition: border-color .2s;
}
.form-group input:focus { border-color: #b8b0a0; }
.login-btn {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, #c8c4bc, #d4cfc6);
  border: 2px dashed #999; border-radius: 12px;
  color: #fff; font-size: 16px; font-weight: 600; letter-spacing: 2px;
  cursor: pointer; transition: all .2s;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  margin-top: 8px;
}
.login-btn:hover { background: linear-gradient(135deg, #b8b4ac, #c8c2b8); }
.login-btn:active { transform: scale(0.98); }
.error-msg {
  text-align: center; color: #c0392b; font-size: 13px; margin-top: 14px;
  min-height: 20px; opacity: 0; transition: opacity .3s;
}
.error-msg.show { opacity: 1; }
.footer-text {
  text-align: center; color: #bbb; font-size: 12px; margin-top: 24px;
}
</style>
</head>
<body>
<div class="login-box">
  <h2>沫离 drpy-node</h2>
  <p class="subtitle">管理后台 — 请登录</p>
  <form id="loginForm" onsubmit="return doLogin(event)">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" class="login-btn">登 录</button>
    <p class="error-msg" id="errorMsg"></p>
  </form>
  <p class="footer-text">默认账号: admin / drpys</p>
</div>
<script>
// 已登录则直接跳回首页
(async () => {
  const cred = localStorage.getItem('drpy_auth');
  if (cred) {
    try {
      const res = await fetch('/api/admin/health', { headers: { 'Authorization': 'Basic ' + cred } });
      if (res.ok) { window.location.href = '/'; return; }
    } catch (e) {}
    localStorage.removeItem('drpy_auth');
  }
})();

async function doLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('errorMsg');
  if (!u || !p) { err.textContent = '请输入用户名和密码'; err.className = 'error-msg show'; return false; }
  const cred = btoa(u + ':' + p);
  try {
    const res = await fetch('/api/admin/health', { headers: { 'Authorization': 'Basic ' + cred } });
    if (res.ok) {
      localStorage.setItem('drpy_auth', cred);
      document.cookie = 'drpy_auth=' + cred + ';path=/;max-age=' + (86400*30);
      window.location.href = '/';
    } else {
      err.textContent = '用户名或密码错误';
      err.className = 'error-msg show';
    }
  } catch (e) {
    err.textContent = '网络错误，请稍后重试';
    err.className = 'error-msg show';
  }
  return false;
}
</script>
</body>
</html>
