<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹幕系统面板 - drpyS</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            --accent: #2563eb;
            --terminal-bg: #0d1117;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header .sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            background: var(--bg-tertiary);
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
        .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.offline { background: var(--error); box-shadow: 0 0 8px var(--error); }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
            border: none;
            background: transparent;
        }
        .tab:hover { color: var(--text-primary); background: var(--bg-tertiary); }
        .tab.active { background: var(--accent); color: #fff; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .test-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 12px; color: var(--text-muted); }
        .field input, .field select {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .field input:focus, .field select:focus { border-color: var(--accent); }
        .field input[type="text"] { width: 280px; }
        .btn {
            background: var(--accent);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--bg-tertiary); border: 1px solid var(--border-color); }

        .result-box {
            margin-top: 16px;
            background: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
            font-size: 13px;
            max-height: 360px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }
        .result-box.show { display: block; }
        .result-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .result-meta .ok { color: var(--success); }
        .result-meta .fail { color: var(--error); }

        .log-controls { display: flex; gap: 10px; align-items: center; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
        .log-table th, .log-table td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .log-table th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 12px;
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
        }
        .log-table tr:hover { background: rgba(148, 163, 184, 0.06); }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .tag.success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .tag.empty { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .tag.error { background: rgba(239, 68, 68, 0.15); color: var(--error); }
        .empty-tip { color: var(--text-muted); text-align: center; padding: 24px 0; font-size: 14px; }

        .config-grid { display: flex; flex-direction: column; gap: 14px; }
        .config-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .config-row label { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
        .config-row .desc { font-size: 12px; color: var(--text-muted); }
        .config-row input {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            font-family: 'SF Mono', Consolas, monospace;
        }
        .config-row input:focus { border-color: var(--accent); }
        .config-save-bar { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
        .config-save-bar .msg { font-size: 13px; }

        .source-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
        .source-table th, .source-table td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .source-table th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
        .source-url { color: var(--text-muted); font-family: monospace; font-size: 12px; word-break: break-all; }
        .source-status { display: inline-flex; align-items: center; gap: 6px; }
        .source-status .dot { width: 8px; height: 8px; border-radius: 50%; }
        .source-status .dot.ok { background: var(--success); }
        .source-status .dot.bad { background: var(--error); }

        .loading { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 640px) {
            .field input[type="text"] { width: 100%; }
            .test-form { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>弹幕系统面板</h1>
                <div class="sub">调试 · 日志 · 配置 · 源检测</div>
            </div>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">检测中...</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="debug">弹幕调试</button>
            <button class="tab" data-tab="logs">弹幕日志</button>
            <button class="tab" data-tab="config">弹幕配置</button>
            <button class="tab" data-tab="sources">弹幕源检测</button>
        </div>

        <!-- 调试 -->
        <div class="tab-panel active" id="panel-debug">
            <div class="card">
                <div class="card-title">弹幕调试</div>
                <div class="test-form">
                    <div class="field">
                        <label>剧名</label>
                        <input type="text" id="testName" placeholder="例如：斗破苍穹" value="斗破苍穹">
                    </div>
                    <div class="field">
                        <label>集数</label>
                        <input type="text" id="testEpisode" placeholder="例如：1" value="1" style="width:100px;">
                    </div>
                    <div class="field">
                        <label>格式</label>
                        <select id="testFormat">
                            <option value="xml">XML（B站格式）</option>
                            <option value="json">JSON（ArtPlayer）</option>
                        </select>
                    </div>
                    <button class="btn" id="testBtn" onclick="runTest()">测试</button>
                </div>
                <div class="result-meta" id="resultMeta" style="display:none;"></div>
                <div class="result-box" id="resultBox"></div>
            </div>
        </div>

        <!-- 日志 -->
        <div class="tab-panel" id="panel-logs">
            <div class="card">
                <div class="card-title" style="justify-content: space-between;">
                    <span>请求日志</span>
                    <div class="log-controls">
                        <label style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:4px;">
                            <input type="checkbox" id="autoRefresh" checked> 自动刷新
                        </label>
                        <button class="btn btn-secondary" onclick="clearLogs()">清空日志</button>
                        <button class="btn btn-secondary" onclick="refreshLogs()">刷新</button>
                    </div>
                </div>
                <div id="logArea">
                    <div class="empty-tip">暂无日志，先在上方测试一条弹幕</div>
                </div>
            </div>
        </div>

        <!-- 配置 -->
        <div class="tab-panel" id="panel-config">
            <div class="card">
                <div class="card-title">弹幕配置</div>
                <div class="config-grid" id="configGrid">
                    <div class="empty-tip">加载配置中...</div>
                </div>
                <div class="config-save-bar" style="display:none;" id="configSaveBar">
                    <button class="btn" onclick="saveConfig()">保存配置</button>
                    <button class="btn btn-secondary" onclick="loadConfig()">重新加载</button>
                    <span class="msg" id="configMsg"></span>
                </div>
            </div>
        </div>

        <!-- 源检测 -->
        <div class="tab-panel" id="panel-sources">
            <div class="card">
                <div class="card-title" style="justify-content: space-between;">
                    <span>弹幕源连通性</span>
                    <button class="btn btn-secondary" onclick="checkSources()">重新检测</button>
                </div>
                <div id="sourceArea">
                    <div class="empty-tip">点击「重新检测」开始</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE = window.location.origin;
        let logTimer = null;
        let configMeta = {};

        async function checkStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            try {
                const resp = await fetch(`${BASE}/danmu/ping`, { signal: AbortSignal.timeout(5000) });
                const data = await resp.json();
                if (data.status === 'ok') {
                    dot.className = 'status-dot online';
                    text.textContent = '服务正常';
                } else {
                    dot.className = 'status-dot offline';
                    text.textContent = '服务异常';
                }
            } catch (e) {
                dot.className = 'status-dot offline';
                text.textContent = '无法连接';
            }
        }

        // ── Tab 切换 ──
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tabName));
            if (tabName === 'logs') refreshLogs();
            if (tabName === 'config') loadConfig();
            if (tabName === 'sources') checkSources();
        }
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                switchTab(tab.dataset.tab);
                if (history.replaceState) history.replaceState(null, '', '#' + tab.dataset.tab);
            });
        });

        // Hash 路由：支持 /apps/danmu-panel/#config 直达对应 tab
        const tabNames = ['debug', 'logs', 'config', 'sources'];
        function applyHash() {
            const h = (window.location.hash || '').replace('#', '');
            if (tabNames.includes(h)) switchTab(h);
        }
        window.addEventListener('hashchange', applyHash);

        // ── 调试 ──
        async function runTest() {
            const name = document.getElementById('testName').value.trim();
            const episode = document.getElementById('testEpisode').value.trim();
            const format = document.getElementById('testFormat').value;
            if (!name) { alert('请输入剧名'); return; }

            const btn = document.getElementById('testBtn');
            const meta = document.getElementById('resultMeta');
            const box = document.getElementById('resultBox');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading">&#8635;</span> 测试中...';
            meta.style.display = 'none';
            box.classList.remove('show');

            const start = performance.now();
            try {
                const url = `${BASE}/danmu?name=${encodeURIComponent(name)}&episode=${encodeURIComponent(episode)}&format=${format}`;
                const resp = await fetch(url, { signal: AbortSignal.timeout(40000) });
                const body = await resp.text();
                const elapsed = ((performance.now() - start) / 1000).toFixed(2);

                let count = 0;
                if (format === 'xml') {
                    const m = body.match(/<d\s/g);
                    count = m ? m.length : 0;
                } else {
                    try { count = JSON.parse(body).length || 0; } catch (e) {}
                }

                meta.style.display = 'flex';
                meta.innerHTML = `
                    <span>耗时 <strong>${elapsed}s</strong></span>
                    <span class="${count > 0 ? 'ok' : 'fail'}">弹幕 <strong>${count}</strong> 条</span>
                    <span>HTTP <strong>${resp.status}</strong></span>
                `;

                box.textContent = format === 'xml'
                    ? body.replace(/</g, '&lt;').replace(/>/g, '&gt;').slice(0, 3000)
                    : JSON.stringify(JSON.parse(body || '[]').slice(0, 30), null, 2);
                box.classList.add('show');
            } catch (e) {
                meta.style.display = 'flex';
                meta.innerHTML = `<span class="fail">请求失败: ${e.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '测试';
                refreshLogs();
            }
        }

        // ── 日志 ──
        async function refreshLogs() {
            const area = document.getElementById('logArea');
            try {
                const resp = await fetch(`${BASE}/danmu/logs?limit=100`, { signal: AbortSignal.timeout(5000) });
                const data = await resp.json();
                const logs = data.logs || [];
                if (logs.length === 0) {
                    area.innerHTML = '<div class="empty-tip">暂无日志，先在上方测试一条弹幕</div>';
                    return;
                }
                let html = '<table class="log-table"><thead><tr><th>时间</th><th>剧名</th><th>集数</th><th>状态</th><th>来源</th><th>条数</th><th>耗时</th></tr></thead><tbody>';
                for (const log of logs) {
                    const time = new Date(log.time).toLocaleTimeString('zh-CN', { hour12: false });
                    const tagClass = log.status === 'success' ? 'success' : (log.status === 'error' ? 'error' : 'empty');
                    const tagText = log.status === 'success' ? '成功' : (log.status === 'error' ? '错误' : '无弹幕');
                    html += `<tr>
                        <td style="color:var(--text-muted)">${time}</td>
                        <td>${escapeHtml(log.name)}</td>
                        <td>${escapeHtml(String(log.episode))}</td>
                        <td><span class="tag ${tagClass}">${tagText}</span></td>
                        <td style="color:var(--text-muted)">${escapeHtml(log.source)}</td>
                        <td>${log.count || 0}</td>
                        <td style="color:var(--text-muted)">${log.duration != null ? log.duration + 'ms' : '-'}</td>
                    </tr>`;
                }
                html += '</tbody></table>';
                area.innerHTML = html;
            } catch (e) {
                area.innerHTML = `<div class="empty-tip">日志加载失败: ${e.message}</div>`;
            }
        }

        async function clearLogs() {
            try {
                await fetch(`${BASE}/danmu/logs/clear`, { signal: AbortSignal.timeout(5000) });
                refreshLogs();
            } catch (e) {
                alert('清空失败: ' + e.message);
            }
        }

        // ── 配置 ──
        async function loadConfig() {
            const grid = document.getElementById('configGrid');
            const bar = document.getElementById('configSaveBar');
            try {
                const resp = await fetch(`${BASE}/danmu/config`, { signal: AbortSignal.timeout(5000) });
                const data = await resp.json();
                if (!data.ok) {
                    grid.innerHTML = `<div class="empty-tip">配置读取失败: ${data.error}</div>`;
                    return;
                }
                configMeta = data.meta || {};
                let html = '';
                for (const key of Object.keys(configMeta)) {
                    const label = configMeta[key].label || key;
                    const desc = configMeta[key].desc || '';
                    const value = data.config[key] != null ? data.config[key] : '';
                    html += `<div class="config-row">
                        <label>${escapeHtml(label)} <span style="color:var(--text-muted);font-weight:400;">(${key})</span></label>
                        <div class="desc">${escapeHtml(desc)}</div>
                        <input type="text" data-key="${key}" value="${escapeHtml(value)}">
                    </div>`;
                }
                grid.innerHTML = html;
                bar.style.display = 'flex';
            } catch (e) {
                grid.innerHTML = `<div class="empty-tip">配置加载失败: ${e.message}</div>`;
            }
        }

        async function saveConfig() {
            const msg = document.getElementById('configMsg');
            const updates = {};
            document.querySelectorAll('#configGrid input[data-key]').forEach(input => {
                updates[input.dataset.key] = input.value;
            });
            msg.style.color = 'var(--text-muted)';
            msg.textContent = '保存中...';
            try {
                const resp = await fetch(`${BASE}/danmu/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates),
                    signal: AbortSignal.timeout(8000),
                });
                const data = await resp.json();
                if (data.ok) {
                    msg.style.color = 'var(--success)';
                    msg.textContent = '已保存并热重载';
                } else {
                    msg.style.color = 'var(--error)';
                    msg.textContent = '保存失败: ' + (data.error || '');
                }
            } catch (e) {
                msg.style.color = 'var(--error)';
                msg.textContent = '保存失败: ' + e.message;
            }
        }

        // ── 源检测 ──
        async function checkSources() {
            const area = document.getElementById('sourceArea');
            area.innerHTML = '<div class="empty-tip"><span class="loading">&#8635;</span> 检测中...</div>';
            try {
                const resp = await fetch(`${BASE}/danmu/sources/check`, { signal: AbortSignal.timeout(30000) });
                const data = await resp.json();
                const results = data.results || [];
                if (results.length === 0) {
                    area.innerHTML = '<div class="empty-tip">没有配置任何弹幕源</div>';
                    return;
                }
                let html = '<table class="source-table"><thead><tr><th>源名称</th><th>地址</th><th>状态</th><th>HTTP</th><th>耗时</th></tr></thead><tbody>';
                for (const r of results) {
                    const ok = r.ok;
                    html += `<tr>
                        <td>${escapeHtml(r.name)}</td>
                        <td class="source-url">${escapeHtml(r.url)}</td>
                        <td><span class="source-status"><span class="dot ${ok ? 'ok' : 'bad'}"></span>${ok ? '正常' : '不可用'}</span></td>
                        <td>${r.status || '-'}</td>
                        <td style="color:var(--text-muted)">${r.duration}ms</td>
                    </tr>`;
                }
                html += '</tbody></table>';
                area.innerHTML = html;
            } catch (e) {
                area.innerHTML = `<div class="empty-tip">检测失败: ${e.message}</div>`;
            }
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function startAutoRefresh() {
            const enabled = document.getElementById('autoRefresh').checked;
            if (logTimer) { clearInterval(logTimer); logTimer = null; }
            if (enabled) {
                logTimer = setInterval(() => {
                    const activePanel = document.querySelector('.tab-panel.active');
                    if (activePanel && activePanel.id === 'panel-logs') refreshLogs();
                }, 3000);
            }
        }

        document.getElementById('autoRefresh').addEventListener('change', startAutoRefresh);
        document.getElementById('testName').addEventListener('keydown', e => { if (e.key === 'Enter') runTest(); });
        document.getElementById('testEpisode').addEventListener('keydown', e => { if (e.key === 'Enter') runTest(); });

        checkStatus();
        applyHash();
        startAutoRefresh();
    </script>
</body>
</html>
